{% extends "base.html" %}

{% block container %}
  <h2 class="mb-4 text-danger">Are you sure you want to delete the "{{ task.name }}" task?</h2>
  <form action="" method="post">
    {% csrf_token %}
    <input type="submit" value="Yes, delete" class="btn btn-danger">
    <a href="{% url 'tasks:task-detail' pk=task.pk%}" class="btn btn-secondary ms-2">Cancel</a>
  </form>
{% endblock %}
